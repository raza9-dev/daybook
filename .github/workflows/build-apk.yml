name: Build Daybook APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Unzip project (if uploaded as a zip)
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d unzipped; done
          find . -path '*/app/build.gradle' -not -path './.git/*'

      - name: Build APK
        run: |
          APP_GRADLE=$(find . -path '*/app/build.gradle' -not -path './.git/*' | sort | tail -1)
          if [ -z "$APP_GRADLE" ]; then echo "app/build.gradle not found. Upload Daybook-android.zip to the repository."; exit 1; fi
          cd "$(dirname "$(dirname "$APP_GRADLE")")"
          echo "Building in: $(pwd)"
          gradle assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk/Daybook.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-APK
          path: apk/Daybook.apk
