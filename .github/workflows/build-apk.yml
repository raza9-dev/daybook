name: Build Daybook APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d unzipped; done
          find . -name build.gradle -not -path './.git/*'

      - name: Build APK
        run: |
          APP_GRADLE=$(find . -path '*/app/build.gradle' -not -path './.git/*' | head -1)
          if [ -z "$APP_GRADLE" ]; then echo "app/build.gradle not found - upload Daybook-android.zip"; exit 1; fi
          cd "$(dirname "$(dirname "$APP_GRADLE")")"
          echo "Building in: $(pwd)"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
