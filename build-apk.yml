name: Build Daybook

# You never need to edit this file again: everything the build needs
# (versions, settings) comes from Daybook-android.zip and its build.sh.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK and AAB
        run: |
          # Unzip every Daybook zip separately and build the one with the highest version,
          # so old zips left in the repository can never be built by mistake.
          rm -rf unzipped && mkdir unzipped
          best=""; bestv=-1; i=0
          for z in *.zip; do
            [ -f "$z" ] || continue
            i=$((i+1)); d="unzipped/z$i"
            unzip -o -q "$z" -d "$d" || continue
            s=$(find "$d" -name build.sh | head -1)
            [ -n "$s" ] || { echo "$z: old version, skipped"; continue; }
            v=$(grep -o 'versionCode [0-9]*' "$(dirname "$s")/app/build.gradle" | grep -o '[0-9]*$' || echo 0)
            echo "$z: versionCode $v"
            if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$s; fi
          done
          if [ -z "$best" ]; then echo "No new Daybook zip found. Upload the latest Daybook-android.zip."; exit 1; fi
          echo "Building $best (versionCode $bestv)"
          bash "$best" "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-APK
          path: out/Daybook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-AAB-for-Play-Store
          path: out/Daybook.aab
